name: Deploy Storybook

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build-storybook
      - name: Commit updated sync marker
        run: |
          if ! git diff --quiet -- .storybook-sync.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .storybook-sync.json
            git commit -m "chore: update Storybook sync marker [skip ci]"
            git push
          fi
      # Written into storybook-static/ so it ships as part of the SAME Pages
      # deploy as Storybook itself — deploy-pages replaces the entire site
      # on every run, so a status page generated in a separate workflow
      # would silently wipe out the real Storybook content on its next
      # deploy. This is exactly why it's tied to Storybook's own rebuild
      # trigger rather than running on every sync.
      - run: node scripts/generate-status-page.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
