name: Deploy Storybook

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Only reachable once deploy-pages above has actually succeeded — the
      # marker is meant to mean "live on Pages," not just "an artifact was
      # built," so it's recorded here, not in the build job. See
      # scripts/record-sync-marker.mjs's header comment for the bug this
      # used to cause (Status tab reading "in sync" from CI's validate-only
      # build, which never deploys anywhere).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run record-sync-marker
      - name: Commit updated sync marker
        run: |
          if ! git diff --quiet -- .storybook-sync.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .storybook-sync.json
            git commit -m "chore: update Storybook sync marker [skip ci]"
            git push
          fi
